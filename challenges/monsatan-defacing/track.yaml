services:
  # List of network services running for the track.
  # Each service name must be unique for a given instance (container/VM).
  - name: HTTP
    # Name of the container or VM
    instance: monsatan-defacing
    # The IPv6 address was randomly generated from the MAC Address (hwaddr) and the subnets defined in main.tf.
    # If you need other machines, you can choose another MAC Address and get the IPv6 from the MAC AND the IPv6 subnet (9000:d37e:c40b:f108) at https://eui64-calc.princelle.org/
    address: "9000:d37e:c40b:f108:216:3eff:fe19:738e"
    # On what port does the service listens to
    port: 80
    # For automated checks during the CTF. This alerts us if something is wrong with the service.
    check: http
  - name: Dart-Registry
    # Name of the container or VM
    instance: monsatan-defacing-dartreg
    # The IPv6 address was randomly generated from the MAC Address (hwaddr) and the subnets defined in main.tf.
    # If you need other machines, you can choose another MAC Address and get the IPv6 from the MAC AND the IPv6 subnet (9000:d37e:c40b:f108) at https://eui64-calc.princelle.org/
    address: "9000:d37e:c40b:f108:216:3eff:feaa:1b4f"
    # On what port does the service listens to
    port: 80
    # For automated checks during the CTF. This alerts us if something is wrong with the service.
    check: http
  - name: GitLab
    # Name of the container or VM
    instance: monsatan-defacing-gitlab
    # The IPv6 address was randomly generated from the MAC Address (hwaddr) and the subnets defined in main.tf.
    # If you need other machines, you can choose another MAC Address and get the IPv6 from the MAC AND the IPv6 subnet (9000:d37e:c40b:f108) at https://eui64-calc.princelle.org/
    address: "9000:d37e:c40b:f108:216:3eff:feaa:1b50"
    # On what port does the service listens to
    port: 80
    # For automated checks during the CTF. This alerts us if something is wrong with the service.
    check: http
