# This is the original message for the track.
type: topic
api:
  user: WoonderK1nd
title: "Monsatan - Kiosk"
body: |-
  I've heard about the campaign Axolotzl is doing against the company Monsatan. I understand that retrograde practices such as advertisement in the open were popular back in the 90s, but we've moved on to better things now. Come on! The city is where we live. I can't believe that people coped with corporations buying panels and walls to sell stuff. Come on, aren't plants and architecture better?
  
  At least this time, this is a bit more discrete. We've found these electronic kiosks near the community market. I'm sure if we're subtle enough, we can play around in there without raising suspicion and see if there's something on these advertising computers, behind all the corporate propaganda.
  