title: "Monsatan - Chatbot"
body: |-
  You do know about Monsatan, right? The "ecofriendly" company that feeds the world safely. Our rooftop greenhouses are full of their stuff.
  
  I hate to see them with their green aura, while in the end, they are just capitalist pigs trying to profit from basic human needs.
  
  I am 100% sure that they are doing shady things and that the pesticides are only the tip of the iceberg.
  
  Just a proof about how they don't care about people: their customer support is an AI chatbot. An AI that burns energy just to mimic humans in the name of profitability. Seems like they started using AI to handle their customer support. Make them regret their choice. Let's try to make the stupid chatbot spit out things that they don't want us to know.
  
  You can find the chatbot at [http://chat.monsatan.ctf](http://chat.monsatan.ctf). Try to extract proof of their shady activities. We need to make them crash and bring them to justice.
