# This Ansible script is used to compile your challenge, create an archive and extract that archive on to the local host.
# This script builds a frontend using NPM and a Rust program. Change it as per your needs.
- name: "Build container"
  hosts: "build-container"
  vars_files:
    - ../track.yaml
  tasks:
    - name: "Load flags"
      loop: "{{ flags }}"
      vars:
        key: "{{ (item.tags).discourse }}"
        value: "{{ item.flag }}"
      ansible.builtin.set_fact:
        track_flags: "{{ track_flags | default({}) | combine({key: value}) }}"

    - name: Check if IPv4 address is set
      ansible.builtin.debug:
        msg: IPv4 address is set
      when: ansible_all_ipv4_addresses | length > 0

    - name: Initial System Upgrade
      ansible.builtin.apt:
        update_cache: true
        install_recommends: false
        upgrade: full

    # Install the tools required to compile your code such as npm, nodejs, gcc...
    - name: Install dependencies to build the track
      ansible.builtin.apt:
        name:
          - curl
          - gcc
          - openssl
          - libssl-dev
          - perl
          - build-essential
          - zlib1g-dev
          - zlib1g
        state: present

    - name: Check if cargo is installed
      ansible.builtin.stat:
        path: /root/.cargo/bin/cargo
      register: cargo_exists

    - name: Download Cargo Installer
      ansible.builtin.get_url:
        url: https://sh.rustup.rs
        dest: /tmp/sh.rustup.rs
        mode: "0755"
        force: true
      when: not cargo_exists.stat.exists
      tags:
        - rust

    - name: Install Cargo
      when: not cargo_exists.stat.exists
      ansible.builtin.command: /tmp/sh.rustup.rs -y
      register: my_output
      changed_when: my_output.rc != 0
      tags:
        - rust

    - name: Install wasm32-unknown-unknown
      when: not cargo_exists.stat.exists
      ansible.builtin.command: /root/.cargo/bin/rustup target add wasm32-unknown-unknown
      tags:
        - rust

    - name: Check if cargo-leptos is installed
      ansible.builtin.stat:
        path: /root/.cargo/bin/cargo-leptos
      register: cargo_leptos_exists

    - name: Install cargo-leptos
      when: not cargo_leptos_exists.stat.exists
      ansible.builtin.command: /root/.cargo/bin/cargo install cargo-leptos
      register: my_output
      changed_when: my_output.rc != 0
      tags:
        - rust

    - name: Copy the challenge sources
      ansible.builtin.copy:
        src: challenge/
        dest: /tmp/monsatan-orders
        owner: root
        group: root
        mode: "0644"

    - name: Build
      ansible.builtin.command:
        cmd: /root/.cargo/bin/cargo-leptos build --release
        chdir: /tmp/monsatan-orders/
      register: my_output
      changed_when: my_output.rc != 0
      environment:
        PATH: "/root/.cargo/bin:{{ ansible_env.PATH }}"

    - name: Create dist directory
      ansible.builtin.file:
        path: /tmp/dist/monsatan-orders
        state: directory
        mode: "0755"

    - name: Copy server binary
      ansible.builtin.copy:
        remote_src: true
        src: /tmp/monsatan-orders/target/release/monsatan-orders
        dest: /tmp/dist/monsatan-orders/monsatan-orders
        owner: root
        group: root
        mode: "0744"

    - name: Copy client
      ansible.builtin.copy:
        remote_src: true
        src: /tmp/monsatan-orders/target/site/
        dest: /tmp/dist/monsatan-orders/site
        owner: root
        group: root
        mode: "0744"

    # Create a TAR archive with the compiled program
    - name: Create archive of build
      community.general.archive:
        path: /tmp/dist/monsatan-orders
        dest: /tmp/build.tar
        format: tar
        mode: "0644"

    # Extract the archive from the build container and save it on the local host
    - name: Fetch archive
      ansible.builtin.fetch:
        src: /tmp/build.tar
        dest: /tmp/nsec/monsatan-orders.tar
        flat: true
