name: monsatan-mailserver
description: "Finale of the Monsatan meta track. Hack into the CEO's mailbox."
# Set to true when the person responsible of the theme has fully integrated the track with the scenario, which implies he wrote the discourse posts.
integrated_with_scenario: true

contacts:
  # Who created the challenges. Use either handles or real names.
  dev:
    - zer0x64 (Philippe Dugre)
  # Who did/does quality assurance on the challenge
  qa:
    - twisted (Simon Bouchard)
  # Who can offer support regarding the challenge during the CTF.
  support:
    - zer0x64 (Philippe Dugre)
    - olipro007 (Olivier St-Jean)
    - junior_n30 (Jean-Francois Blain)

instances:
  monsatan-mailserver:
    image: "images:ubuntu/24.04"
    profiles:
      - "default"
      - "containers"
    type: "container"
    description: "Mail Server for Monsatan"
    # This second half of a MAC address was automatically generated. The first half is just below
    hwaddr: "00:16:3e:3e:15:d6"
    # This is the subdomain value for this machine. Do NOT include .ctf, it will be automatically added.
    # For example, if the value of the record is a.b.c, a DNS record will be created for a.b.c.ctf
    record: "mail.monsatan"
    # This second half of the IPv6 is derived from the hwaddr.
    ipv6: "9000:d37e:c40b:f6af:216:3eff:fe3e:15d6"
    config: {}
    devices: []
    services:
      # List of network services running for the track.
      # Each service name must be unique for a given instance (container/VM).
      - name: HTTP
        # On what port does the service listens to
        port: 80
        # For automated checks during the CTF. This alerts us if something is wrong with the service.
        check: http
        # During development, this service will be accessible from http://localhost:800. This allows to access the services outside the host (for example from the Windows Host if using WSL or from your host machine if using GitHub Codespaces).
        # This is not required, but provides a very helpful shortcut when using Codespaces or WSL.
        dev_port_mapping: 800
  build-container:
    is_build_container: true
    image: "images:ubuntu/24.04"
    profiles:
      - "default"
    type: "container"
    description: "Building container"
    hwaddr:
    record:
    ipv6:
    config: {}
    devices:
      - name: "root"
        type: "disk"
        properties:
          pool: "default"
          path: "/"
          size: "5GiB"
    services: []

  # You can add more machines here.

flags:
  # The flag string
  - flag: FLAG-{4f7146512805da9381cc7f49fa7242a9}
    # How many points for the flag
    value: 16
    # Description of the flag. This text will be displayed to the participants AFTER they submit the flag if they run the `askgod history` command.
    description: Password of the database root user.
    # The text the participants see AFTER they submit the flag.
    return_string: "[monsatan-mailserver] 1/2 You should always sign all data you don't want to be tampered with."
    # CFSS string based on https://github.com/res260/cfss
    cfss: "CFSS:0.3/TS:I/E:H/HSFC:Y=10-16"
    tags:
      # Name of the discourse trigger for this flag. If a discourse post in the posts/ directory has this trigger, it will be posted when this flag is submitted.
      # This value can also be used to reference flags in Ansible playbooks. See the "Load Flags" task in deploy.yaml.
      discourse: monsatan_mailserver_flag_1
    # The flag string
  - flag: FLAG-{ada5d92b4247a947d7d0e6dd52a9bb55}
    # How many points for the flag
    value: 12
    # Description of the flag. This text will be displayed to the participants AFTER they submit the flag if they run the `askgod history` command.
    description: Found in an email in the CEO's inbox.
    # The text the participants see AFTER they submit the flag.
    return_string: "[monsatan-mailserver] 2/2 WASM + WASI can be quite powerful if you know how to use it. *YOU NOW HAVE A CHOICE FOR THE STORY*"
    # CFSS string based on https://github.com/res260/cfss
    cfss: "CFSS:0.3/TS:I/E:H/HSFC:Y=10-16"
    tags:
      # Name of the discourse trigger for this flag. If a discourse post in the posts/ directory has this trigger, it will be posted when this flag is submitted.
      # This value can also be used to reference flags in Ansible playbooks. See the "Load Flags" task in deploy.yaml.
      discourse: monsatan_mailserver_flag_2
  - flag: FLAG-{18480821ORDER54303867}
    # How many points for the flag
    value: 0
    # Description of the flag. This text will be displayed to the participants AFTER they submit the flag if they run the `askgod history` command.
    description: Story choice - ORDER.
    # The text the participants see AFTER they submit the flag.
    return_string: "[monsatan-mailserver] You have chosen order. This track is over."
    tags:
      # Name of the discourse trigger for this flag. If a discourse post in the posts/ directory has this trigger, it will be posted when this flag is submitted.
      # This value can also be used to reference flags in Ansible playbooks. See the "Load Flags" task in deploy.yaml.
      discourse: monsatan_mailserver_flag_3
      ui_gif: clap.gif
      ui_sound: victory.mp3
  - flag: FLAG-{7882008CHAOS27550727}
    # How many points for the flag
    value: 0
    # Description of the flag. This text will be displayed to the participants AFTER they submit the flag if they run the `askgod history` command.
    description: Story choice - CHAOS.
    # The text the participants see AFTER they submit the flag.
    return_string: "[monsatan-mailserver] You have chosen chaos. This track is over."
    tags:
      # Name of the discourse trigger for this flag. If a discourse post in the posts/ directory has this trigger, it will be posted when this flag is submitted.
      # This value can also be used to reference flags in Ansible playbooks. See the "Load Flags" task in deploy.yaml.
      discourse: monsatan_mailserver_flag_4
      ui_gif: dox_luigi.gif
      ui_sound: fbi-open-up.mp3
