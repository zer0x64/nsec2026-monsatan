# This Ansible script is used to compile your challenge, create an archive and extract that archive on to the local host.
# This script builds a frontend using NPM and a Rust program. Change it as per your needs.
- name: "Build container"
  hosts: "build-container"
  vars_files:
    - ../track.yaml
  tasks:
    - name: "Load flags"
      loop: "{{ flags }}"
      vars:
        key: "{{ (item.tags).discourse }}"
        value: "{{ item.flag }}"
      ansible.builtin.set_fact:
        track_flags: "{{ track_flags | default({}) | combine({key: value}) }}"

    - name: Check if IPv4 address is set
      ansible.builtin.debug:
        msg: IPv4 address is set
      when: ansible_all_ipv4_addresses | length > 0

    - name: Initial System Upgrade
      ansible.builtin.apt:
        update_cache: true
        install_recommends: false
        upgrade: full

    # Install the tools required to compile your code such as npm, nodejs, gcc...
    - name: Install dependencies to build the track
      ansible.builtin.apt:
        name:
          - npm
          - curl
        state: present

    - name: Check if cargo is installed
      ansible.builtin.stat:
        path: /root/.cargo/bin/cargo
      register: cargo_exists

    - name: Download Cargo Installer
      ansible.builtin.get_url:
        url: https://sh.rustup.rs
        dest: /tmp/sh.rustup.rs
        mode: "0755"
        force: true
      when: not cargo_exists.stat.exists
      tags:
        - rust

    - name: Install Cargo
      when: not cargo_exists.stat.exists
      ansible.builtin.command: /tmp/sh.rustup.rs -y
      register: my_output
      changed_when: my_output.rc != 0
      tags:
        - rust

    - name: Install wasm32-wasip2 target
      when: not cargo_exists.stat.exists
      ansible.builtin.command: /root/.cargo/bin/rustup target add wasm32-wasip2
      environment:
        PATH: /root/.cargo/bin:{{ ansible_facts["env"]["PATH"] }}
      tags:
        - rust

    - name: Install wasm-tools
      when: not cargo_exists.stat.exists
      ansible.builtin.command: /root/.cargo/bin/cargo install wasm-tools
      environment:
        PATH: /root/.cargo/bin:{{ ansible_facts["env"]["PATH"] }}
      tags:
        - rust

    - name: Copy the challenge sources
      ansible.builtin.copy:
        src: challenge/
        dest: /tmp/monsatan-mailserver
        owner: root
        group: root
        mode: "0644"

    - name: NPM install (if IPv4)
      community.general.npm:
        path: /tmp/monsatan-mailserver/client/
      environment:
        NODE_OPTIONS: "--dns-result-order=ipv4first"
      when: ansible_all_ipv4_addresses | length > 0

    - name: NPM install (if IPv6)
      community.general.npm:
        path: /tmp/monsatan-mailserver/client/
      when: ansible_all_ipv4_addresses | length == 0

    - name: Build server
      ansible.builtin.command:
        cmd: /root/.cargo/bin/cargo build --release
        chdir: /tmp/monsatan-mailserver/
      register: my_output
      changed_when: my_output.rc != 0
      environment:
        PATH: /root/.cargo/bin:{{ ansible_facts["env"]["PATH"] }}

    - name: Build quote of the day server
      ansible.builtin.command:
        cmd: /root/.cargo/bin/cargo build --release
        chdir: /tmp/monsatan-mailserver/quote_of_the_day
      register: my_output
      changed_when: my_output.rc != 0
      environment:
        PATH: /root/.cargo/bin:{{ ansible_facts["env"]["PATH"] }}

    - name: Create dist directory
      ansible.builtin.file:
        path: /tmp/dist/monsatan-mailserver
        state: directory
        mode: "0755"

    - name: Copy server binary
      ansible.builtin.copy:
        remote_src: true
        src: /tmp/monsatan-mailserver/target/release/monsatan-mailserver
        dest: /tmp/dist/monsatan-mailserver/monsatan-mailserver
        owner: root
        group: root
        mode: "0744"

    - name: Copy quote of the day server binary
      ansible.builtin.copy:
        remote_src: true
        src: /tmp/monsatan-mailserver/target/release/quote_of_the_day
        dest: /tmp/dist/monsatan-mailserver/quote_of_the_day
        owner: root
        group: root
        mode: "0744"

    - name: Copy client
      ansible.builtin.copy:
        remote_src: true
        src: /tmp/monsatan-mailserver/dist
        dest: /tmp/dist/monsatan-mailserver/
        owner: root
        group: root
        mode: "0644"

    - name: Create client plugin directory
      ansible.builtin.file:
        path: /tmp/dist/monsatan-mailserver/dist/static/plugins/
        state: directory
        mode: "0755"

    - name: Build plugin packager
      ansible.builtin.command:
        cmd: /root/.cargo/bin/cargo build --release
        chdir: /tmp/monsatan-mailserver/plugin_packager/
      register: my_output
      changed_when: my_output.rc != 0
      environment:
        PATH: /root/.cargo/bin:{{ ansible_facts["env"]["PATH"] }}

    - name: List plugins
      ansible.builtin.find:
        paths: /tmp/monsatan-mailserver/plugins/
        file_type: directory
        recurse: false
      register: plugins

    - name: Build plugins
      ansible.builtin.command:
        cmd: /root/.cargo/bin/cargo build --release --target wasm32-wasip2
        chdir: "{{ item.path }}"
      with_items: "{{ plugins.files }}"
      register: my_output
      changed_when: my_output.rc != 0
      environment:
        PATH: /root/.cargo/bin:{{ ansible_facts["env"]["PATH"] }}

    - name: Package plugins
      ansible.builtin.command:
        cmd: /tmp/monsatan-mailserver/target/release/plugin_packager /tmp/monsatan-mailserver/target/wasm32-wasip2/release/{{ item.path | basename | replace("-", "_") }}.wasm {{ item.path }}/manifest.toml
        chdir: /tmp/dist/monsatan-mailserver/dist/static/plugins/
      with_items: "{{ plugins.files }}"

    # Create a TAR archive with the compiled program
    - name: Create archive of build
      community.general.archive:
        path: /tmp/dist/monsatan-mailserver
        dest: /tmp/build.tar
        format: tar
        mode: "0644"

    # Extract the archive from the build container and save it on the local host
    - name: Fetch archive
      ansible.builtin.fetch:
        src: /tmp/build.tar
        dest: /tmp/nsec/monsatan-mailserver.tar
        flat: true
